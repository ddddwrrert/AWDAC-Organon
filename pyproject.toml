[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "awdac-organon"
version = "0.1.0"
requires-python = ">=3.11"

[project.scripts]
awdac = "awdac.cli:main"

[tool.setuptools.package-data]
awdac = ["default.toml"]
"awdac.memory" = ["schema.sql"]

[tool.setuptools.packages.find]
include = ["awdac*"]
